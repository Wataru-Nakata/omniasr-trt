[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniasr-trt"
version = "0.1.0"
description = "Fast Omnilingual ASR (omniASR CTC and LLM) inference without fairseq2"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8",  # tested: 2.8 (Triton 3.4) and 2.14 (Triton 3.8)
    "numpy",
    "sentencepiece",
    "safetensors",
    "soundfile",
]

[project.scripts]
omniasr-trt = "omniasr_trt.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/omniasr_trt"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
